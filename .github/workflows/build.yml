
name: Controllo, Compila, Testa ed Esporta Eseguibile

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      format_rust:
        description: "Applica cargo fmt e registra le modifiche sul branch selezionato"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-rust:
    name: Formattazione automatica Rust
    if: github.event_name == 'workflow_dispatch' && inputs.format_rust == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarica il branch selezionato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verifica branch di destinazione
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "refactor/src-domain-layout" ]; then
            echo "::error::Branch non autorizzato per questa operazione."
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Applica formattazione Rust
        run: cargo fmt --all

      - name: Registra le modifiche sul branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "I file Rust sono già formattati."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u
          git commit -m "Apply Rust formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  check-project:
    name: Controllo preliminare Rust
    if: github.event_name != 'workflow_dispatch' || inputs.format_rust != true
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verifica formattazione Rust
        run: cargo fmt --all -- --check

      - name: Installa dipendenze Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Controllo statico di tutti i target Rust
        shell: bash
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee cargo-check.log

      - name: Riepilogo controllo preliminare superato
        if: success()
        shell: bash
        run: |
          {
            echo "### ✅ Controllo preliminare superato"
            echo ""
            echo "- Controllo statico di tutti i target Rust: superato"
            echo "- Formattazione Rust: superata"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mostra log su errore controllo preliminare
        if: failure()
        shell: bash
        run: |
          {
            echo "### ❌ Errore nel controllo preliminare Rust"
            echo ""

            if [ -f cargo-check.log ]; then
              echo "#### Log compilazione preliminare"
              echo '```text'
              tail -n 100 cargo-check.log
              echo '```'
            else
              echo "Il controllo preliminare si è interrotto prima della compilazione."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Compilazione e test Windows
    needs: check-project
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compila per Windows
        run: cargo build --release

      - name: Esegui test unitari Windows
        run: cargo test --release

      - name: Esegui test headless Windows
        run: cargo run --release
        env:
          CI: "true"

      - name: Carica Artifact Windows
        uses: actions/upload-artifact@v4
        with:
          name: gioco-windows
          path: target/release/*.exe

  build-linux:
    name: Compilazione e test Linux
    needs: check-project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installa dipendenze grafiche/audio Linux per Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compila per Linux
        run: cargo build --release

      - name: Esegui test unitari Linux
        run: cargo test --release

      - name: Esegui test headless Linux
        run: cargo run --release
        env:
          CI: "true"

      - name: Carica Artifact Linux
        uses: actions/upload-artifact@v4
        with:
          name: gioco-linux
          path: target/release/fellowship_wow_crawler
