name: Controllo, Compila, Testa ed Esporta Eseguibile

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-project:
    name: Controllo preliminare Rust
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verifica formattazione Rust
        id: formatting
        shell: bash
        run: |
          if cargo fmt --all -- --check > cargo-fmt.log 2>&1; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "Formattazione Rust superata."
          else
            echo "status=warning" >> "$GITHUB_OUTPUT"
            echo "::warning title=Formattazione Rust::Sono presenti differenze di formattazione. Il controllo non blocca la compilazione."

            files="$(grep -E '^Diff in ' cargo-fmt.log | sed -E 's#^Diff in .*?/wow-friendship-crawler/([^:]+):[0-9]+:.*#\1#' | sort -u || true)"

            {
              echo "### ⚠️ Differenze di formattazione Rust"
              echo ""
              echo "Il controllo rustfmt ha rilevato differenze nei file seguenti:"
              echo ""
              if [ -n "$files" ]; then
                printf '%s\n' "$files" | sed 's/^/- /'
              else
                echo "Consultare il log cargo-fmt.log."
              fi
              echo ""
              echo "La formattazione non blocca i controlli di compilazione e i test."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Installa dipendenze Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Controllo statico di tutti i target Rust
        shell: bash
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee cargo-check.log

      - name: Riepilogo controllo preliminare superato
        if: success()
        shell: bash
        run: |
          {
            echo "### ✅ Controllo preliminare superato"
            echo ""
            echo "- Controllo statico di tutti i target Rust: superato"
            if [ "${{ steps.formatting.outputs.status }}" = "warning" ]; then
              echo "- Formattazione Rust: avvisi presenti, non bloccanti"
            else
              echo "- Formattazione Rust: superata"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mostra log su errore controllo preliminare
        if: failure()
        shell: bash
        run: |
          {
            echo "### ❌ Errore nel controllo preliminare Rust"
            echo ""

            if [ -f cargo-check.log ]; then
              echo "#### Log compilazione preliminare"
              echo '```text'
              tail -n 100 cargo-check.log
              echo '```'
            else
              echo "Il controllo preliminare si è interrotto prima della compilazione."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Compilazione e test Windows
    needs: check-project
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compila per Windows
        run: cargo build --release

      - name: Esegui test unitari Windows
        run: cargo test --release

      - name: Esegui test headless Windows
        run: cargo run --release
        env:
          CI: "true"

      - name: Carica Artifact Windows
        uses: actions/upload-artifact@v4
        with:
          name: gioco-windows
          path: target/release/*.exe

  build-linux:
    name: Compilazione e test Linux
    needs: check-project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installa dipendenze grafiche/audio Linux per Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compila per Linux
        run: cargo build --release

      - name: Esegui test unitari Linux
        run: cargo test --release

      - name: Esegui test headless Linux
        run: cargo run --release
        env:
          CI: "true"

      - name: Carica Artifact Linux
        uses: actions/upload-artifact@v4
        with:
          name: gioco-linux
          path: target/release/fellowship_wow_crawler
